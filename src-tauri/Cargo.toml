[package]
name = "yomi-reader"
version = "0.20.0"
description = "Leitor local de mangás para Windows"
authors = ["Selene contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "yomi_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
walkdir = "2"
natord = "1"
rfd = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"





